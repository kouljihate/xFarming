{% extends "base.html" %}

{% block title %}Add Sector - xFarming{% endblock %}

{% block content %}
<a href="{{ url_for('lands.detail', land_id=land_id) }}" class="btn btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Add Sector</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Sector Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <button type="submit" class="btn btn-primary">Add Sector</button>
        </form>
    </div>
</div>
{% endblock %}
