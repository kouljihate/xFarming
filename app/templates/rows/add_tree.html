{% extends "base.html" %}

{% block title %}Add Tree - xFarming{% endblock %}

{% block content %}
<a href="{{ url_for('rows.detail', row_id=row_id) }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Add Tree</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Tree Name</label>
                <input type="text" class="form-control" name="name">
            </div>
            <button type="submit" class="btn rounded-pill btn-primary">Add Tree</button>
        </form>
    </div>
</div>
{% endblock %}
