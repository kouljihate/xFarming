<div class="modal fade{% if show_add_modal %} show{% endif %}" id="addFarmModal" tabindex="-1" {% if show_add_modal %}
    style="display: block;" {% endif %}>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi-plus-circle me-2"></i>{{ t('add', session.get('lang', 'en')) }} {{
                    t('farm', session.get('lang', 'en')) }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="{{ url_for('farms.add') }}" enctype="multipart/form-data">
                <div class="modal-body">
                    <ul class="nav nav-tabs mb-3" id="farmAddTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="basic-tab" data-bs-toggle="tab"
                                data-bs-target="#basic-pane" type="button" role="tab">
                                <i class="bi-info-circle me-1"></i>Basic
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="status-tab" data-bs-toggle="tab" data-bs-target="#status-pane"
                                type="button" role="tab">
                                <i class="bi-clipboard-check me-1"></i>Status
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="docs-tab" data-bs-toggle="tab" data-bs-target="#docs-pane"
                                type="button" role="tab">
                                <i class="bi-file-earmark-text me-1"></i>Documents & Photos
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="farmAddTabContent">
                        <!-- TAB 1: BASIC -->
                        <div class="tab-pane fade show active" id="basic-pane" role="tabpanel">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-geo-alt me-2"></i>FARM</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Farm ID</label>
                                            <input type="text" class="form-control rounded-pill" name="farm_id"
                                                value="{{ form_data.get('farm_id', '') if form_data is defined else '' }}">
                                        </div>

                                        <div class="col-md-8 mb-3">
                                            <label class="form-label">Farm Name</label>
                                            <input type="text" class="form-control rounded-pill" name="farm_name"
                                                value="{{ form_data.get('farm_name', '') if form_data is defined else '' }}" required>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Address / Street</label>
                                            <input type="text" class="form-control rounded-pill" name="street"
                                                value="{{ form_data.get('street', '') if form_data is defined else '' }}">
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">City</label>
                                            <input type="text" class="form-control rounded-pill" name="city"
                                                value="{{ form_data.get('city', '') if form_data is defined else '' }}">
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Latitude</label>
                                            <input type="number" step="any" class="form-control rounded-pill" name="latitude"
                                                id="addFarmLatitude"
                                                value="{{ form_data.get('latitude', '') if form_data is defined else '' }}"
                                                oninput="fetchAltitude()">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Longitude</label>
                                            <input type="number" step="any" class="form-control rounded-pill" name="longitude"
                                                id="addFarmLongitude"
                                                value="{{ form_data.get('longitude', '') if form_data is defined else '' }}"
                                                oninput="fetchAltitude()">
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Altitude (m) <small class="text-muted">auto</small></label>
                                            <input type="number" step="any" class="form-control rounded-pill" name="altitude"
                                                id="addFarmAltitude"
                                                value="{{ form_data.get('altitude', 0) if form_data is defined else 0 }}"
                                                readonly disabled>
                                            <div id="addFarmAltitudeStatus" class="form-text"></div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Description</label>
                                        <textarea class="form-control rounded" name="description"
                                            rows="2">{{ form_data.get('description', '') if form_data is defined else '' }}</textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-pin-map me-2"></i>COORDINATE BOUNDARIES</h6>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Coordinates</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control rounded" name="coordinates"
                                                id="farmCoordinates" placeholder="[(lat1, lon1), (lat2, lon2), ...]"
                                                value="{{ calc_coords if calc_coords else form_data.get('coordinates', '') if form_data is defined else '' }}">
                                            <button type="button" onclick="calculateCoords()"
                                                class="btn btn-primary rounded-pill" title="Calculate">
                                                <i class="bi-arrow-repeat"></i>
                                            </button>
                                        </div>
                                        <small class="text-muted">Enter as [(lat, lon), (lat, lon), ...] and click
                                            Calculate</small>
                                        <div id="calcStatus" class="form-text"></div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Area (Hectares)</label>
                                            <input type="number" class="form-control rounded-pill" name="area"
                                                id="farmArea"
                                                value="{{ calc_area if calc_area is defined else form_data.get('area', 0) if form_data is defined else 0 }}"
                                                readonly>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Perimeter (Meters)</label>
                                            <input type="number" class="form-control rounded-pill" name="perimeter"
                                                id="farmPerimeter"
                                                value="{{ calc_perimeter if calc_perimeter is defined else form_data.get('perimeter', 0) if form_data is defined else 0 }}"
                                                readonly>
                                        </div>
                                        <div class="col-md-2 mb-3">
                                            <label class="form-label">Latitude</label>
                                            <input type="number" step="0.01" class="form-control rounded-pill"
                                                name="center_lat" id="farmCenterLat"
                                                value="{{ calc_center_lat if calc_center_lat is defined else form_data.get('center_lat', 0) if form_data is defined else 0 }}"
                                                readonly>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Longitude</label>
                                            <input type="number" step="0.01" class="form-control rounded-pill"
                                                name="center_lon" id="farmCenterLon"
                                                value="{{ calc_center_lon if calc_center_lon is defined else form_data.get('center_lon', 0) if form_data is defined else 0 }}"
                                                readonly>
                                        </div>
                                    </div>
                                    <input type="hidden" name="boundary" id="farmBoundary"
                                        value="{{ form_data.get('boundary', '') if form_data is defined else '' }}">

                                </div>
                            </div>
                        </div>

                        <!-- TAB 2: STATUS -->
                        <div class="tab-pane fade" id="status-pane" role="tabpanel">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-droplet me-2"></i>SOIL</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Soil Type</label>
                                            <select class="form-select rounded-pill" name="soil_type">
                                                <option value="" disabled {% if not form_data.get('soil_type')
                                                    %}selected{% endif %}>
                                                    -- Select soil type --
                                                </option>
                                                <option value="loam" {% if form_data.get('soil_type')=='loam'
                                                    %}selected{% endif %}>Loam</option>
                                                <option value="clay" {% if form_data.get('soil_type')=='clay'
                                                    %}selected{% endif %}>Clay</option>
                                                <option value="sandy" {% if form_data.get('soil_type')=='sandy'
                                                    %}selected{% endif %}>Sandy</option>
                                                <option value="silt" {% if form_data.get('soil_type')=='silt'
                                                    %}selected{% endif %}>Silt</option>
                                                <option value="peat" {% if form_data.get('soil_type')=='peat'
                                                    %}selected{% endif %}>Peat</option>
                                                <option value="chalky" {% if form_data.get('soil_type')=='chalky'
                                                    %}selected{% endif %}>Chalky</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Topography</label>
                                            <select class="form-select rounded-pill" name="topography">
                                                <option value="" disabled {% if not form_data.get('topography')
                                                    %}selected{% endif %}>
                                                    -- Select topography --
                                                </option>
                                                <option value="flat" {% if form_data.get('topography')=='flat'
                                                    %}selected{% endif %}>Flat</option>
                                                <option value="sloping" {% if form_data.get('topography')=='sloping'
                                                    %}selected{% endif %}>Sloping</option>
                                                <option value="hilly" {% if form_data.get('topography')=='hilly'
                                                    %}selected{% endif %}>Hilly</option>
                                                <option value="mountainous" {% if
                                                    form_data.get('topography')=='mountainous' %}selected{% endif %}>
                                                    Mountainous</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4 mb-3">
                                            <label class="form-label">Climate Zone</label>
                                            <select class="form-select rounded-pill" name="climate_zone">
                                                <option value="" disabled {% if not form_data.get('climate_zone')
                                                    %}selected{% endif %}>
                                                    -- Select climate zone --
                                                </option>
                                                <option value="Costal-Med" {% if
                                                    form_data.get('climate_zone')=='Costal-Med' %}selected{% endif %}>
                                                    Coastal Mediterranean</option>
                                                <option value="Interior-Med" {% if
                                                    form_data.get('climate_zone')=='Interior-Med' %}selected{% endif %}>
                                                    Interior Mediterranean</option>
                                                <option value="Mountain-Atlas" {% if
                                                    form_data.get('climate_zone')=='Mountain-Atlas' %}selected{% endif
                                                    %}>Mountain Atlas</option>
                                                <option value="Desert" {% if form_data.get('climate_zone')=='Desert'
                                                    %}selected{% endif %}>Desert</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-water me-2"></i>IRRIGATION</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Type</label>
                                            <select class="form-select rounded-pill" name="irrigation_type">
                                                <option value="" {% if not form_data.get('irrigation_type') %}selected{%
                                                    endif %}>-- Select --</option>
                                                <option value="drip" {% if form_data.get('irrigation_type')=='drip'
                                                    %}selected{% endif %}>Drip</option>
                                                <option value="sprinkler" {% if
                                                    form_data.get('irrigation_type')=='sprinkler' %}selected{% endif %}>
                                                    Sprinkler</option>
                                                <option value="flood" {% if form_data.get('irrigation_type')=='flood'
                                                    %}selected{% endif %}>Flood</option>
                                                <option value="center_pivot" {% if
                                                    form_data.get('irrigation_type')=='center_pivot' %}selected{% endif
                                                    %}>Center Pivot</option>
                                                <option value="manual" {% if form_data.get('irrigation_type')=='manual'
                                                    %}selected{% endif %}>Manual</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Source</label>
                                            <select class="form-select rounded-pill" name="irrigation_source">
                                                <option value="" {% if not form_data.get('irrigation_source')
                                                    %}selected{% endif %}>-- Select --</option>
                                                <option value="well" {% if form_data.get('irrigation_source')=='well'
                                                    %}selected{% endif %}>Well</option>
                                                <option value="river" {% if form_data.get('irrigation_source')=='river'
                                                    %}selected{% endif %}>River</option>
                                                <option value="dam" {% if form_data.get('irrigation_source')=='dam'
                                                    %}selected{% endif %}>Dam</option>
                                                <option value="borehole" {% if
                                                    form_data.get('irrigation_source')=='borehole' %}selected{% endif
                                                    %}>Borehole</option>
                                                <option value="rainwater" {% if
                                                    form_data.get('irrigation_source')=='rainwater' %}selected{% endif
                                                    %}>Rainwater</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Capacity (LPH)</label>
                                            <input type="number" class="form-control rounded-pill"
                                                name="irrigation_capacity"
                                                value="{{ form_data.get('irrigation_capacity', 0) }}">
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label class="form-label">Status</label>
                                            <select class="form-select rounded-pill" name="status">
                                                <option value="active" {% if form_data.get('status')=='active'
                                                    %}selected{% endif %}>Active</option>
                                                <option value="inactive" {% if form_data.get('status')=='inactive'
                                                    %}selected{% endif %}>Inactive</option>
                                                <option value="maintenance" {% if form_data.get('status')=='maintenance'
                                                    %}selected{% endif %}>Under Maintenance</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Notes</label>
                                        <textarea class="form-control rounded" name="irrigation_notes"
                                            rows="2">{{ form_data.get('irrigation_notes', '') }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- TAB 3: DOCUMENTS & PHOTOS -->
                        <div class="tab-pane fade" id="docs-pane" role="tabpanel">
                            <div class="card mb-3">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-file-earmark me-2"></i>LEGAL</h6>
                                </div>
                                <div class="card-body">
                                    <div class="row">

                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Registration Number</label>
                                            <input type="text" class="form-control rounded-pill"
                                                name="registration_number"
                                                value="{{ form_data.get('registration_number', '') }}">
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Legal Documents (comma-separated)</label>
                                        <input type="text" class="form-control rounded-pill" name="legal_docs"
                                            value="{{ form_data.get('legal_docs', '') }}"
                                            placeholder="e.g. Title Deed, Survey Report">
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Lease Status</label>
                                            <select class="form-select rounded-pill" name="lease_status">
                                                <option value="owned" {% if form_data.get('lease_status')=='owned'
                                                    %}selected{% endif %}>Owned</option>
                                                <option value="leased" {% if form_data.get('lease_status')=='leased'
                                                    %}selected{% endif %}>Leased</option>
                                                <option value="rented" {% if form_data.get('lease_status')=='rented'
                                                    %}selected{% endif %}>Rented</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label class="form-label">Expiry Date</label>
                                            <input type="date" class="form-control rounded-pill" name="lease_expiry"
                                                value="{{ form_data.get('lease_expiry', '') }}">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <div class="card-header bg-light">
                                    <h6 class="mb-0"><i class="bi-camera me-2"></i>PHOTOS</h6>
                                </div>
                                <div class="card-body">
                                    <div class="mb-3">
                                        <label class="form-label">Upload Photos</label>
                                        <input type="file" class="form-control rounded-pill" name="photos" multiple
                                            accept="image/*">
                                        <small class="text-muted">You can select multiple images</small>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Photo Description</label>
                                        <textarea class="form-control rounded" name="photo_description" rows="2"
                                            placeholder="Describe the photos...">{{ form_data.get('photo_description', '') }}</textarea>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">General Notes</label>
                                        <textarea class="form-control rounded" name="notes" rows="3"
                                            placeholder="Additional notes...">{{ form_data.get('notes', '') }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">
                        <i class="bi-x-circle me-1"></i>Cancel
                    </button>
                    <button type="submit" name="action" value="save" class="btn rounded-pill btn-success">
                        <i class="bi-check-circle me-1"></i>Save
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
let altitudeTimer = null;
function fetchAltitude() {
    clearTimeout(altitudeTimer);
    altitudeTimer = setTimeout(function() {
        var lat = document.getElementById('addFarmLatitude').value;
        var lon = document.getElementById('addFarmLongitude').value;
        var statusEl = document.getElementById('addFarmAltitudeStatus');
        var altInput = document.getElementById('addFarmAltitude');
        if (!lat || !lon || lat === '0' || lon === '0') {
            statusEl.textContent = '';
            return;
        }
        statusEl.textContent = 'Fetching altitude...';
        statusEl.className = 'form-text text-info';
        fetch('/farms/api/altitude?lat=' + encodeURIComponent(lat) + '&lon=' + encodeURIComponent(lon))
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.altitude !== undefined) {
                    altInput.value = data.altitude;
                    statusEl.textContent = 'Elevation: ' + data.altitude + ' m';
                    statusEl.className = 'form-text text-success';
                } else {
                    altInput.value = '';
                    statusEl.textContent = data.error || 'Altitude unavailable';
                    statusEl.className = 'form-text text-warning';
                }
            })
            .catch(function() {
                altInput.value = '';
                statusEl.textContent = 'Failed to fetch altitude';
                statusEl.className = 'form-text text-danger';
            });
    }, 500);
}

function calculateCoords() {
    var coordsStr = document.getElementById('farmCoordinates').value.trim();
    var statusEl = document.getElementById('calcStatus');
    if (!coordsStr) {
        statusEl.textContent = 'Please enter coordinates first';
        statusEl.className = 'form-text text-warning';
        return;
    }
    statusEl.textContent = 'Calculating...';
    statusEl.className = 'form-text text-info';
    fetch('/farms/api/calculate?coords=' + encodeURIComponent(coordsStr))
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) {
                statusEl.textContent = data.error;
                statusEl.className = 'form-text text-danger';
                return;
            }
            document.getElementById('farmArea').value = data.area_ha;
            document.getElementById('farmPerimeter').value = data.perimeter_m;
            document.getElementById('farmCenterLat').value = data.center_lat;
            document.getElementById('farmCenterLon').value = data.center_lon;
            if (data.geojson) {
                document.getElementById('farmBoundary').value = data.geojson;
            }
            statusEl.textContent = 'Area: ' + data.area_ha + ' ha | Perimeter: ' + data.perimeter_m + ' m';
            statusEl.className = 'form-text text-success';
        })
        .catch(function() {
            statusEl.textContent = 'Failed to calculate';
            statusEl.className = 'form-text text-danger';
        });
}
</script>
