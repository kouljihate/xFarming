<div class="modal fade" id="deleteLandModal{{ land._id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('lands.delete', land_id=land._id) }}">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Delete {{ land.name }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete land "{{ land.name }}"?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
