<div class="modal fade" id="uploadPhotoModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('lands.upload_photo', land_id=land._id) }}" enctype="multipart/form-data">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi-cloud-upload me-2"></i>Upload Photos</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi-images me-1"></i>Select Photos</label>
                        <input type="file" class="form-control" name="photos" multiple accept="image/*" required>
                        <small class="text-muted">Hold Ctrl (or Cmd) to select multiple files</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi-card-text me-1"></i>Photo Descriptions (Optional)</label>
                        <textarea class="form-control" name="photo_descriptions" rows="3" placeholder="Enter descriptions for each photo (one per line)"></textarea>
                        <small class="text-muted">Enter one description per line, matching the order of selected photos</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-success"><i class="bi-cloud-upload me-1"></i>Upload</button>
                </div>
            </form>
        </div>
    </div>
</div>
