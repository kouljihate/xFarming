<div class="modal fade" id="editLandModal{{ land._id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('lands.edit', land_id=land._id) }}">
                <div class="modal-header bg-{{ session.get('theme', 'minty') }} text-white">
                    <h5 class="modal-title">Edit {{ land.name }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <h6>Basic Info</h6>
                            <div class="mb-3">
                                <label class="form-label">Farm ID</label>
                                <input type="text" class="form-control" name="farm_id" value="{{ land.farm_id or '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">{{ t('land_name', session.get('lang', 'en')) }}</label>
                                <input type="text" class="form-control" name="name" value="{{ land.name }}" required>
                            </div>
                            
                            <!-- Owner Information Group -->
                            <div class="border p-3 rounded mb-3">
                                <h6 class="mb-3"><i class="bi-person-badge me-2"></i>Owner Information</h6>
                                <div class="mb-3">
                                    <label class="form-label">Party ID</label>
                                    <input type="text" class="form-control" name="owner_party_id" value="{{ land.owner.party_id if land.owner else 'P001' }}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Owner Name</label>
                                    <input type="text" class="form-control" name="owner_name" value="{{ land.owner.name if land.owner else '' }}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Owner Email</label>
                                    <input type="email" class="form-control" name="owner_email" value="{{ land.owner.contact.email if land.owner and land.owner.contact else '' }}">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Owner Phone</label>
                                    <input type="tel" class="form-control" name="owner_phone" value="{{ land.owner.contact.phone if land.owner and land.owner.contact else '' }}">
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <h6>Location</h6>
                            <div class="mb-3">
                                <label class="form-label">Street</label>
                                <input type="text" class="form-control" name="street" value="{{ land.location.address.street if land.location and land.location.address else '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" name="city" value="{{ land.location.address.city if land.location and land.location.address else '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">State</label>
                                <input type="text" class="form-control" name="state" value="{{ land.location.address.state if land.location and land.location.address else '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Postal Code</label>
                                <input type="text" class="form-control" name="postal_code" value="{{ land.location.address.postal_code if land.location and land.location.address else '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" class="form-control" name="country" value="{{ land.location.address.country if land.location and land.location.address else '' }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Latitude</label>
                                <input type="number" step="any" class="form-control" name="latitude" value="{{ land.location.coordinates.latitude if land.location and land.location.coordinates else 0.0 }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Longitude</label>
                                <input type="number" step="any" class="form-control" name="longitude" value="{{ land.location.coordinates.longitude if land.location and land.location.coordinates else 0.0 }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Area (acres)</label>
                                <input type="number" step="any" class="form-control" name="area" value="{{ land.location.total_area.value if land.location and land.location.total_area else 0.0 }}">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
