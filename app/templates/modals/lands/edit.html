<div class="modal fade" id="editLandModal{{ land._id }}" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('lands.edit', land_id=land._id) }}">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title">Edit {{ land.name }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="border p-3 rounded mb-3">
                        <h6 class="mb-3 bg-success text-white p-2"><i class="bi-tag me-2"></i>Basic Information</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-hash me-1"></i>Land ID</label>
                                <input type="text" class="form-control rounded-pill" name="land_id"
                                    value="{{ land.land_id or '' }}">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label"><i class="bi-geo-alt me-1"></i>Name</label>
                                <input type="text" class="form-control rounded-pill" name="name" value="{{ land.name }}"
                                    required>
                            </div>
                        </div>
                    </div>

                    <div class="border p-3 rounded mb-3">
                        <h6 class="mb-3 bg-success text-white p-2"><i class="bi-house me-2"></i>Address</h6>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi-house me-1"></i>Street</label>
                                <input type="text" class="form-control rounded-pill" name="street"
                                    value="{{ land.location.address.street if land.location and land.location.address else '' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="bi-building me-1"></i>City</label>
                                <input type="text" class="form-control rounded-pill" name="city"
                                    value="{{ land.location.address.city if land.location and land.location.address else '' }}">
                            </div>
                        </div>
                    </div>

                    <div class="border p-3 rounded mb-3">
                        <h6 class="mb-3 bg-success text-white p-2"><i class="bi-geo me-2"></i>Center Coordinate</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-geo-alt me-1"></i>Latitude</label>
                                <input type="number" step="any" class="form-control rounded-pill" name="latitude"
                                    value="{{ land.location.center_coordinate.latitude if land.location and land.location.center_coordinate else 0.0 }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-geo-alt me-1"></i>Longitude</label>
                                <input type="number" step="any" class="form-control rounded-pill" name="longitude"
                                    value="{{ land.location.center_coordinate.longitude if land.location and land.location.center_coordinate else 0.0 }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-arrow-up me-1"></i>Altitude (m)</label>
                                <input type="number" step="any" class="form-control rounded-pill" name="altitude"
                                    value="{{ (land.location.altitude.minimum + land.location.altitude.maximum) / 2 if land.location and land.location.altitude else 0 }}">
                            </div>
                        </div>
                    </div>

                    <div class="border p-3 rounded mb-3">
                        <h6 class="mb-3 bg-success text-white p-2"><i class="bi-info-circle me-2"></i>Metadata</h6>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-calendar me-1"></i>Established Date</label>
                                <input type="date" class="form-control rounded-pill" name="established_date"
                                    value="{{ land.metadata.established_date if land.metadata else '' }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-check-circle me-1"></i>Status</label>
                                <select class="form-select rounded-pill" name="status">
                                    <option value="active" {% if land.metadata and land.metadata.status=='active'
                                        %}selected{% endif %}>Active</option>
                                    <option value="inactive" {% if land.metadata and land.metadata.status=='inactive'
                                        %}selected{% endif %}>Inactive</option>
                                    <option value="maintenance" {% if land.metadata and
                                        land.metadata.status=='maintenance' %}selected{% endif %}>Under Maintenance
                                    </option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label"><i class="bi-hash me-1"></i>Version</label>
                                <input type="number" class="form-control rounded-pill" name="version"
                                    value="{{ land.metadata.version if land.metadata and land.metadata.version else 1 }}"
                                    min="1">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="bi-text-paragraph me-1"></i>Notes</label>
                            <textarea class="form-control rounded-pill" name="notes"
                                rows="2">{{ land.metadata.notes if land.metadata and land.metadata.notes else '' }}</textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
