<div class="modal fade" id="addTreeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('trees.add') }}">
                <input type="hidden" name="row_id" id="addTreeRowId">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi-plus-circle me-2"></i>{{ t('add', session.get('lang', 'en')) }}
                        {{ t('tree', session.get('lang', 'en')) }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Row</label>
                        <select class="form-select rounded-pill" name="row_id_display" disabled>
                            {% for row in rows %}
                            <option value="{{ row._id }}">{{ row.name }} ({{ row.zone.name if row.zone else 'Unknown' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Tree Name (for display)</label>
                                <input type="text" class="form-control rounded-pill" name="name" value="Tree">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tree Number</label>
                                <input type="text" class="form-control rounded-pill" name="tree_number" placeholder="001, 002, etc.">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Species</label>
                                <input type="text" class="form-control rounded-pill" name="species" placeholder="e.g., Persea americana">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Variety</label>
                                <input type="text" class="form-control rounded-pill" name="crop_variety" placeholder="e.g., Hass, Fuerte">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Planting Date</label>
                                <input type="date" class="form-control rounded-pill" name="planting_date">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Age (years)</label>
                                <input type="number" class="form-control rounded-pill" name="age" value="0" min="0">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Status (metadata)</label>
                                <select class="form-select rounded-pill" name="status">
                                    <option value="healthy">Healthy</option>
                                    <option value="needs_attention">Needs Attention</option>
                                    <option value="critical">Critical</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Latitude</label>
                                <input type="number" step="any" class="form-control rounded-pill" name="latitude" value="0.0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Longitude</label>
                                <input type="number" step="any" class="form-control rounded-pill" name="longitude" value="0.0">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Row</label>
                                <select class="form-select rounded-pill" name="row_id" required>
                                    {% for row in rows %}
                                    <option value="{{ row._id }}">{{ row.name }} ({{ row.zone.name if row.zone else 'Unknown' }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
