<div class="modal fade" id="addRowModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('rows.add') }}">
                <div class="modal-header bg-{{ session.get('theme', 'minty') }} text-white">
                    <h5 class="modal-title">{{ t('add', session.get('lang', 'en')) }} {{ t('rows', session.get('lang', 'en')) }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Row Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Zone</label>
                        <select class="form-select" name="zone_id" required>
                            {% for zone in zones %}
                            <option value="{{ zone._id }}">{{ zone.name }} ({{ zone.sector.name if zone.sector else 'Unknown' }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
