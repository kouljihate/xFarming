<div class="modal fade" id="editRowModal{{ row._id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('rows.edit', row_id=row._id) }}">
                <div class="modal-header bg-{{ session.get('theme', 'minty') }} text-white">
                    <h5 class="modal-title">Edit {{ row.name }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Row Name</label>
                        <input type="text" class="form-control rounded-pill" name="name" value="{{ row.name }}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
