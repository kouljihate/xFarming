<div class="modal fade" id="addSectorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi-plus-circle me-2"></i>{{ t('add', session.get('lang', 'en')) }} {{
                    t('sector', session.get('lang', 'en')) }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="{{ url_for('sectors.add') }}">
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sector ID</label>
                            <input type="text" class="form-control rounded-pill" name="sector_id" placeholder="Auto-generated">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sector Number</label>
                            <input type="number" class="form-control rounded-pill" name="sector_number" value="1" min="1">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sector Name</label>
                        <input type="text" class="form-control rounded-pill" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control rounded-pill" name="description" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Area</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="area" value="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="area_unit">
                                <option value="acres">Acres</option>
                                <option value="hectares">Hectares</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Soil Type</label>
                            <select class="form-select rounded-pill" name="soil_type">
                                <option value="loam">Loam</option>
                                <option value="clay">Clay</option>
                                <option value="sandy">Sandy</option>
                                <option value="silt">Silt</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Slope</label>
                            <input type="text" class="form-control rounded-pill" name="slope">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Irrigation Type</label>
                            <input type="text" class="form-control rounded-pill" name="irrigation_type">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Boundary (JSON)</label>
                        <textarea class="form-control rounded-pill" name="boundary" rows="2"
                            placeholder='{"type": "Polygon", "coordinates": []}'></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select rounded-pill" name="status">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control rounded-pill" name="notes" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Land</label>
                        <select class="form-select rounded-pill" name="land_id" required>
                            {% for land in lands %}
                            <option value="{{ land._id }}">{{ land.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
