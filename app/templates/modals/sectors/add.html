<div class="modal fade" id="addSectorModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title"><i class="bi-plus-circle me-2"></i>{{ t('add', session.get('lang', 'en')) }} {{
                    t('sector', session.get('lang', 'en')) }}</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form method="POST" action="{{ url_for('sectors.add') }}">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Land</label>
                        <select class="form-select rounded-pill" name="land_id" required>
                            {% for land in lands %}
                            <option value="{{ land._id }}">{{ land.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sector Number</label>
                            <input type="number" class="form-control rounded-pill" name="sector_number" value="1"
                                min="1">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Sector Name</label>
                            <input type="text" class="form-control rounded-pill" name="name" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Coordinates</label>
                        <div class="input-group">
                            <input type="text" class="form-control rounded" name="coordinates" id="sectorCoordinates"
                                placeholder="[(x1, y1), (x2, y2), (x3, y3), ...]"
                                value="{{ calc_coords if calc_coords else '' }}">
                            <button type="submit" name="calculate" value="1" class="btn btn-primary rounded-pill"
                                title="Convert & Calculate">
                                <i class="bi-arrow-repeat"></i>
                            </button>
                        </div>
                        <small class="text-muted">Enter as [(x, y), (x, y), ...] and click the button</small>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Area (Hectares)</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="area"
                                value="{{ calc_area if calc_area is defined else 0 }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Perimeter (Meters)</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="perimeter"
                                value="{{ calc_perimeter if calc_perimeter is defined else 0 }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Soil Type</label>
                            <select class="form-select rounded-pill" name="soil_type">
                                <option value="loam">Loam</option>
                                <option value="clay">Clay</option>
                                <option value="sandy">Sandy</option>
                                <option value="silt">Silt</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Irrigation Type</label>
                            <input type="text" class="form-control rounded-pill" name="irrigation_type">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Boundary (GeoJSON)</label>
                        <textarea class="form-control rounded" name="boundary"
                            rows="2">{{ calc_geojson if calc_geojson else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-select rounded-pill" name="status">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control rounded" name="notes" rows="2"></textarea>
                    </div>

                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
