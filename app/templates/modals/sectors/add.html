<div class="modal fade" id="addSectorModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('sectors.add') }}">
                <div class="modal-header">
                    <h5 class="modal-title">{{ t('add', session.get('lang', 'en')) }} {{ t('sectors', session.get('lang', 'en')) }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Sector Name</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Land</label>
                        <select class="form-select" name="land_id" required>
                            {% for land in lands %}
                            <option value="{{ land._id }}">{{ land.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add</button>
                </div>
            </form>
        </div>
    </div>
</div>
