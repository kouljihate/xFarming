<div class="modal fade" id="editSectorModal{{ sector._id }}" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('sectors.edit', sector_id=sector._id) }}">
                <div class="modal-header">
                    <h5 class="modal-title">Edit {{ sector.name }}</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Sector Name</label>
                        <input type="text" class="form-control" name="name" value="{{ sector.name }}" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
