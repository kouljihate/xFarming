<div class="modal fade" id="editZoneModal{{ zone._id }}" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <form method="POST" action="{{ url_for('zones.edit', zone_id=zone._id) }}">
                <div class="modal-header bg-{{ session.get('theme', 'minty') }} text-white">
                    <h5 class="modal-title">Edit {{ zone.name }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zone ID</label>
                            <input type="text" class="form-control rounded-pill" name="zone_id" value="{{ zone.get('zone_id', '') }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zone Number</label>
                            <input type="text" class="form-control rounded-pill" name="zone_number" value="{{ zone.get('zone_number', '') }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Zone Name</label>
                        <input type="text" class="form-control rounded-pill" name="name" value="{{ zone.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control rounded-pill" name="description" rows="2">{{ zone.get('description', '') }}</textarea>
                    </div>
                    <hr>
                    <h6 class="mb-3">Location</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Area</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="area_value" value="{{ zone.get('location', {}).get('area', {}).get('value', 0) }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="area_unit">
                                <option value="acres" {% if zone.get('location', {}).get('area', {}).get('unit', 'acres') == 'acres' %}selected{% endif %}>Acres</option>
                                <option value="hectares" {% if zone.get('location', {}).get('area', {}).get('unit', '') == 'hectares' %}selected{% endif %}>Hectares</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Row Spacing</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="row_spacing_value" value="{{ zone.get('location', {}).get('row_spacing', {}).get('value', 0) }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="row_spacing_unit">
                                <option value="feet" {% if zone.get('location', {}).get('row_spacing', {}).get('unit', 'feet') == 'feet' %}selected{% endif %}>Feet</option>
                                <option value="meters" {% if zone.get('location', {}).get('row_spacing', {}).get('unit', '') == 'meters' %}selected{% endif %}>Meters</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Tree Spacing</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="tree_spacing_value" value="{{ zone.get('location', {}).get('tree_spacing', {}).get('value', 0) }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="tree_spacing_unit">
                                <option value="feet" {% if zone.get('location', {}).get('tree_spacing', {}).get('unit', 'feet') == 'feet' %}selected{% endif %}>Feet</option>
                                <option value="meters" {% if zone.get('location', {}).get('tree_spacing', {}).get('unit', '') == 'meters' %}selected{% endif %}>Meters</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Orientation</label>
                            <input type="text" class="form-control rounded-pill" name="orientation" value="{{ zone.get('location', {}).get('orientation', '') }}" placeholder="N-S">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Boundary (JSON)</label>
                        <textarea class="form-control rounded-pill" name="boundary" rows="2">{{ zone.get('boundary', '') }}</textarea>
                    </div>
                    <hr>
                    <h6 class="mb-3">Crop Info</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Current Crop</label>
                            <input type="text" class="form-control rounded-pill" name="current_crop" value="{{ zone.get('crop_info', {}).get('current_crop', '') }}" placeholder="Olives">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Variety</label>
                            <input type="text" class="form-control rounded-pill" name="variety" value="{{ zone.get('crop_info', {}).get('variety', '') }}" placeholder="Arbequina">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Planting Date</label>
                            <input type="date" class="form-control rounded-pill" name="planting_date" value="{{ zone.get('crop_info', {}).get('planting_date', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Root Stock</label>
                            <input type="text" class="form-control rounded-pill" name="root_stock" value="{{ zone.get('crop_info', {}).get('root_stock', '') }}" placeholder="Own roots">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pollinators (comma-separated)</label>
                        <input type="text" class="form-control rounded-pill" name="pollinators" value="{{ zone.get('crop_info', {}).get('pollinators', [])|join(', ') }}">
                    </div>
                    <hr>
                    <h6 class="mb-3">Soil Characteristics</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Soil Type</label>
                            <input type="text" class="form-control rounded-pill" name="soil_type" value="{{ zone.get('soil_characteristics', {}).get('type', '') }}" placeholder="Loam">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">pH</label>
                            <input type="number" step="0.1" class="form-control rounded-pill" name="ph" value="{{ zone.get('soil_characteristics', {}).get('ph', 0.0) }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Organic Matter</label>
                            <input type="text" class="form-control rounded-pill" name="organic_matter" value="{{ zone.get('soil_characteristics', {}).get('organic_matter', '') }}" placeholder="2%">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Drainage</label>
                            <input type="text" class="form-control rounded-pill" name="drainage" value="{{ zone.get('soil_characteristics', {}).get('drainage', '') }}" placeholder="Well-drained">
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Statistics</h6>
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Total Rows</label>
                            <input type="number" class="form-control rounded-pill" name="total_rows" value="{{ zone.get('statistics', {}).get('total_rows', 0) }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Total Trees</label>
                            <input type="number" class="form-control rounded-pill" name="total_trees" value="{{ zone.get('statistics', {}).get('total_trees', 0) }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Trees/Acre</label>
                            <input type="number" class="form-control rounded-pill" name="trees_per_acre" value="{{ zone.get('statistics', {}).get('trees_per_acre', 0) }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Active Trees</label>
                            <input type="number" class="form-control rounded-pill" name="active_trees" value="{{ zone.get('statistics', {}).get('active_trees', 0) }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Dead Trees</label>
                            <input type="number" class="form-control rounded-pill" name="dead_trees" value="{{ zone.get('statistics', {}).get('dead_trees', 0) }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Replacement Rate</label>
                            <input type="text" class="form-control rounded-pill" name="replacement_rate" value="{{ zone.get('statistics', {}).get('replacement_rate', '') }}" placeholder="5%">
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Maintenance</h6>
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Pruned</label>
                            <input type="date" class="form-control rounded-pill" name="last_pruned" value="{{ zone.get('maintenance', {}).get('last_pruned', '') }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Fertilized</label>
                            <input type="date" class="form-control rounded-pill" name="last_fertilized" value="{{ zone.get('maintenance', {}).get('last_fertilized', '') }}">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Irrigated</label>
                            <input type="date" class="form-control rounded-pill" name="last_irrigated" value="{{ zone.get('maintenance', {}).get('last_irrigated', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Next Maintenance</label>
                            <input type="date" class="form-control rounded-pill" name="next_maintenance" value="{{ zone.get('maintenance', {}).get('next_maintenance', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Maintenance Notes</label>
                            <textarea class="form-control rounded-pill" name="maintenance_notes" rows="1">{{ zone.get('maintenance', {}).get('maintenance_notes', '') }}</textarea>
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Metadata</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Created Date</label>
                            <input type="date" class="form-control rounded-pill" name="created_date" value="{{ zone.get('metadata', {}).get('created_date', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Last Updated</label>
                            <input type="date" class="form-control rounded-pill" name="last_updated" value="{{ zone.get('metadata', {}).get('last_updated', '') }}">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select rounded-pill" name="status">
                                <option value="active" {% if zone.get('metadata', {}).get('status', 'active') == 'active' %}selected{% endif %}>Active</option>
                                <option value="inactive" {% if zone.get('metadata', {}).get('status', '') == 'inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Zone Manager</label>
                            <input type="text" class="form-control rounded-pill" name="zone_manager" value="{{ zone.get('metadata', {}).get('zone_manager', '') }}" placeholder="Manager name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control rounded-pill" name="notes" rows="2">{{ zone.get('metadata', {}).get('notes', '') }}</textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Update</button>
                </div>
            </form>
        </div>
    </div>
</div>
