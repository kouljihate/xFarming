<div class="modal fade" id="addZoneModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <p>{{ url_for('zones.add') }}</p>
            <form method="POST" action="{{ url_for('zones.add') }}">
                <input type="hidden" name="land_id" id="addZoneLandId">
                <input type="hidden" name="sector_id" id="addZoneSectorId">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi-plus-circle me-2"></i>{{ t('add', session.get('lang', 'en')) }}
                        {{ t('zone', session.get('lang', 'en')) }}</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zone ID</label>
                            <input type="text" class="form-control rounded-pill" name="zone_id"
                                placeholder="Auto-generated">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Zone Number</label>
                            <input type="text" class="form-control rounded-pill" name="zone_number" placeholder="Z01">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Zone Name</label>
                        <input type="text" class="form-control rounded-pill" name="name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control rounded-pill" name="description" rows="2"></textarea>
                    </div>
                    <hr>
                    <h6 class="mb-3">Location</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Area</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="area_value"
                                value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="area_unit">
                                <option value="acres">Acres</option>
                                <option value="hectares">Hectares</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Row Spacing</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="row_spacing_value"
                                value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="row_spacing_unit">
                                <option value="feet">Feet</option>
                                <option value="meters">Meters</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Tree Spacing</label>
                            <input type="number" step="0.01" class="form-control rounded-pill" name="tree_spacing_value"
                                value="0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Unit</label>
                            <select class="form-select rounded-pill" name="tree_spacing_unit">
                                <option value="feet">Feet</option>
                                <option value="meters">Meters</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Orientation</label>
                            <input type="text" class="form-control rounded-pill" name="orientation" placeholder="N-S">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Boundary (JSON)</label>
                        <textarea class="form-control rounded-pill" name="boundary" rows="2"
                            placeholder='{"type": "Polygon", "coordinates": []}'></textarea>
                    </div>
                    <hr>
                    <h6 class="mb-3">Crop Info</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Current Crop</label>
                            <input type="text" class="form-control rounded-pill" name="current_crop"
                                placeholder="Olives">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Variety</label>
                            <input type="text" class="form-control rounded-pill" name="variety" placeholder="Arbequina">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Planting Date</label>
                            <input type="date" class="form-control rounded-pill" name="planting_date">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Root Stock</label>
                            <input type="text" class="form-control rounded-pill" name="root_stock"
                                placeholder="Own roots">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Pollinators (comma-separated)</label>
                        <input type="text" class="form-control rounded-pill" name="pollinators"
                            placeholder="Variety A, Variety B">
                    </div>
                    <hr>
                    <h6 class="mb-3">Soil Characteristics</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Soil Type</label>
                            <input type="text" class="form-control rounded-pill" name="soil_type" placeholder="Loam">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">pH</label>
                            <input type="number" step="0.1" class="form-control rounded-pill" name="ph" value="0.0">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Organic Matter</label>
                            <input type="text" class="form-control rounded-pill" name="organic_matter" placeholder="2%">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Drainage</label>
                            <input type="text" class="form-control rounded-pill" name="drainage"
                                placeholder="Well-drained">
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Statistics</h6>
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Total Rows</label>
                            <input type="number" class="form-control rounded-pill" name="total_rows" value="0">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Total Trees</label>
                            <input type="number" class="form-control rounded-pill" name="total_trees" value="0">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Trees/Acre</label>
                            <input type="number" class="form-control rounded-pill" name="trees_per_acre" value="0">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Active Trees</label>
                            <input type="number" class="form-control rounded-pill" name="active_trees" value="0">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Dead Trees</label>
                            <input type="number" class="form-control rounded-pill" name="dead_trees" value="0">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Replacement Rate</label>
                            <input type="text" class="form-control rounded-pill" name="replacement_rate"
                                placeholder="5%">
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Maintenance</h6>
                    <div class="row">
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Pruned</label>
                            <input type="date" class="form-control rounded-pill" name="last_pruned">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Fertilized</label>
                            <input type="date" class="form-control rounded-pill" name="last_fertilized">
                        </div>
                        <div class="col-md-2 mb-3">
                            <label class="form-label">Last Irrigated</label>
                            <input type="date" class="form-control rounded-pill" name="last_irrigated">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Next Maintenance</label>
                            <input type="date" class="form-control rounded-pill" name="next_maintenance">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Maintenance Notes</label>
                            <textarea class="form-control rounded-pill" name="maintenance_notes" rows="1"></textarea>
                        </div>
                    </div>
                    <hr>
                    <h6 class="mb-3">Metadata</h6>
                    <div class="row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Created Date</label>
                            <input type="date" class="form-control rounded-pill" name="created_date">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Last Updated</label>
                            <input type="date" class="form-control rounded-pill" name="last_updated">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select rounded-pill" name="status">
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label">Zone Manager</label>
                            <input type="text" class="form-control rounded-pill" name="zone_manager"
                                placeholder="Manager name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea class="form-control rounded-pill" name="notes" rows="2"></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn rounded-pill btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn rounded-pill btn-primary">Add Zone</button>
                </div>
            </form>
        </div>
    </div>
</div>
