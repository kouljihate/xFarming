{% extends "base.html" %}

{% block title %}Edit {{ zone.name }} - SmartFarmerFlow{% endblock %}

{% block content %}
<a href="{{ url_for('zones.detail', zone_id=zone._id) }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Edit Zone</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Zone Name</label>
                <input type="text" class="form-control rounded-pill" name="name" value="{{ zone.name }}" required>
            </div>
            <button type="submit" class="btn rounded-pill btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
