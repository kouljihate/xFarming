{% extends "base.html" %}

{% block title %}{{ t('zones', session.get('lang', 'en')) }} - xFarming{% endblock %}

{% block content %}
<a href="{{ url_for('sectors.index') }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>{{ t('add', session.get('lang', 'en')) }} {{ t('zones', session.get('lang', 'en')) }}</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Zone Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Sector</label>
                <select class="form-select" name="sector_id" required>
                    {% for sector in sectors %}
                    <option value="{{ sector._id }}">{{ sector.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn rounded-pill btn-primary"><i class="bi-plus-circle"></i> {{ t('add', session.get('lang', 'en')) }}</button>
        </form>
    </div>
</div>
{% endblock %}
