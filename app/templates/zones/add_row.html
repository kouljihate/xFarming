{% extends "base.html" %}

{% block title %}Add Row - SFarming{% endblock %}

{% block content %}
<a href="{{ url_for('zones.detail', zone_id=zone_id) }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Add Row</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Row Name</label>
                <input type="text" class="form-control rounded-pill" name="name" required>
            </div>
            <button type="submit" class="btn rounded-pill btn-primary">Add Row</button>
        </form>
    </div>
</div>
{% endblock %}
