{% extends "base.html" %}

{% block title %}Add Zone - SFarming{% endblock %}

{% block content %}
<a href="{{ url_for('sectors.detail', sector_id=sector_id) }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Add Zone</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Zone Name</label>
                <input type="text" class="form-control rounded-pill" name="name" required>
            </div>
            <button type="submit" class="btn rounded-pill btn-primary">Add Zone</button>
        </form>
    </div>
</div>
{% endblock %}
