{% extends "base.html" %}

{% block title %}Add Sector - xFarming{% endblock %}

{% block content %}
<a href="{{ url_for('sectors.index') }}" class="btn rounded-pill btn-secondary mb-3">{{ t('back', session.get('lang', 'en')) }}</a>
<h2>Add Sector</h2>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Sector Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="description" rows="2"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Area</label>
                    <input type="number" step="0.01" class="form-control" name="area" value="0">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Unit</label>
                    <select class="form-select" name="area_unit">
                        <option value="acres">Acres</option>
                        <option value="hectares">Hectares</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Soil Type</label>
                    <select class="form-select" name="soil_type">
                        <option value="loam">Loam</option>
                        <option value="clay">Clay</option>
                        <option value="sandy">Sandy</option>
                        <option value="silt">Silt</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Slope</label>
                    <input type="text" class="form-control" name="slope">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Irrigation Type</label>
                    <input type="text" class="form-control" name="irrigation_type">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status">
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Notes</label>
                <textarea class="form-control" name="notes" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Boundary (JSON - Optional)</label>
                <textarea class="form-control" name="boundary" rows="3" placeholder='{"type": "Polygon", "coordinates": [[[lon, lat], ...]]}'></textarea>
                <small class="text-muted">Enter boundary as JSON with type and coordinates</small>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sector ID (Optional)</label>
                    <input type="text" class="form-control" name="sector_id" placeholder="Auto-generated if empty">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Sector Number</label>
                    <input type="number" class="form-control" name="sector_number" value="1" min="1">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Land</label>
                <select class="form-select" name="land_id" required>
                    {% for land in lands %}
                    <option value="{{ land._id }}">{{ land.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn rounded-pill btn-primary">Add Sector</button>
        </form>
    </div>
</div>
{% endblock %}
