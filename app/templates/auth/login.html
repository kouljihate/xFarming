{% extends "base.html" %}

{% block title %}{{ t('login', session.get('lang', 'en')) }} - xFarming{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h4 class="mb-0"><i class="bi-box-arrow-in-right me-2"></i>{{ t('login', session.get('lang', 'en'))
                        }}</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label"><i class="bi-person me-1"></i>{{ t('username',
                                session.get('lang', 'en')) }}</label>
                            <input type="text" class="form-control rounded-pill form-control-lg" id="username" name="username"
                                placeholder="{{ t('username', session.get('lang', 'en')) }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label"><i class="bi-lock me-1"></i>{{ t('password',
                                session.get('lang', 'en')) }}</label>
                            <input type="password" class="form-control rounded-pill form-control-lg" id="password" name="password"
                                placeholder="{{ t('password', session.get('lang', 'en')) }}" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn rounded-pill btn-primary btn-lg">{{ t('login', session.get('lang',
                                'en')) }}</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center text-muted py-3">
                    <small>🌾 Smart Farm Management by Koul</small><br>
                    <small class="text-muted">v{{ app_version }}</small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
