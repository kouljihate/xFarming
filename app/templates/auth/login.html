{% extends "base.html" %}

{% block title %}{{ t('login', session.get('lang', 'en')) }} - xFarming{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0">{{ t('login', session.get('lang', 'en')) }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">{{ t('username', session.get('lang', 'en')) }}</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">{{ t('password', session.get('lang', 'en')) }}</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">{{ t('login', session.get('lang', 'en')) }}</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
