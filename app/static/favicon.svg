  <!-- Water drops (irrigation) -->
  <ellipse cx="38" cy="60" rx="4" ry="6" fill="#3b82f6"/>
  <ellipse cx="62" cy="60" rx="4" ry="6" fill="#3b82f6"/>
  <!-- Flow lines -->
